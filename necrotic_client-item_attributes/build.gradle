apply plugin: 'java'
apply plugin: 'application'

mainClassName = 'org.necrotic.client.Client'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDir 'src/java/'
        }
        resources {
            srcDir 'src/resources/'
        }
    }
}

buildscript {
    repositories {
        flatDir dirs: 'proguard/lib'
    }
    dependencies {
        classpath ':proguard'
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io/' }
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    implementation 'com.github.MinnDevelopment:java-discord-rpc:v1.3.1'
    implementation 'com.github.MinnDevelopment:discord-rpc-release:v3.3.0'
}

task fatJar(type: Jar) {
    manifest {
        attributes 'Implementation-Title': 'Psycho Client',
                   'Implementation-Version': 1,
                   'Main-Class': 'org.necrotic.client.Client'
    }
    archiveBaseName = 'Psycho-gamepack-unobfuscated'
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

task proguard(type: proguard.gradle.ProGuardTask) {
    configuration 'proguard.txt'
    injars "${buildDir}/libs/Psycho-gamepack-unobfuscated.jar"
    outjars "${buildDir}/libs/Psycho-gamepack.jar"
    libraryjars 'proguard/rt.jar'
    printmapping 'obfuscation.map'
}

task buildjar {
    dependsOn 'fatJar'
    dependsOn 'proguard'
    tasks.findByName('proguard').mustRunAfter 'fatJar'
}
